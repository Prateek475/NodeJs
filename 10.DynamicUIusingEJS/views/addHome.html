<!DOCTYPE html>
<html lang="en">
<head>
  <title>AddHome to airbnb</title>
  <link rel="stylesheet" href="/output.css">
</head>
<body>
 <header class="bg-red-500 text-white p-4 shadow-md">

    <nav class="container mx-auto flex justify-between items-center">

      <ul class="flex space-x-4">

        <li>
          <a href="/" class="hover:bg-red-400 py-2 px-4 rounded transition duration-300">
            Go to Home
          </a>
        </li>

        <li>
          <a href="/add-home" class="hover:bg-red-400 py-2 px-4 rounded transition duration-300">
            Add home
          </a>
        </li>

      </ul>

    </nav>

  </header>
  <h1 class="text-3xl font-bold text-gray-800 text-center mt-10">
  Register your home here...
</h1>

<main class="container mx-auto max-w-xl mt-8 bg-white shadow-lg rounded-lg p-8">

  <form action="/add-home" method="post" class="flex flex-col gap-5">

    <div>
      <label for="housename" class="block text-gray-700 font-semibold mb-2">
        House Name
      </label>

      <input
        type="text"
        id="housename"
        placeholder="Enter the name of your house"
        name="housename"
        class="w-full border border-gray-300 rounded-lg px-4 py-3
               text-gray-700 outline-none
               focus:ring-2 focus:ring-red-400 focus:border-red-400
               transition duration-200"
      >
    </div>

    <button
      type="submit"
      class="bg-red-500 text-white font-semibold py-3 px-6 rounded-lg
             hover:bg-red-600 shadow-md hover:shadow-lg
             transition duration-300"
    >
      Submit
    </button>

  </form>

</main>
</body>
</html>
